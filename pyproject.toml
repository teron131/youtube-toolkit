[project]
name = "youtube-toolkit"
version = "0.23.3"
description = "Transcript-first YouTube research toolkit for agents and local workflows"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "openai>=3.26.1",
  "opencc>=1.3.1",
  "platformdirs>=4.12.4",
  "python-dotenv>=1.2.4",
  "yt-dlp[default]>=2026.9.27.232945.dev0",
]

[dependency-groups]
dev = ["pytest>=9.0.2", "ruff>=0.15.1"]

[project.scripts]
youtube = "youtube_toolkit.cli.__main__:main"

[project.optional-dependencies]
vision = ["numpy>=2.4.0", "opencv-python>=4.14.0,<5", "pillow>=11.0.0", "scenedetect>=0.7.1"]
stt = ["librosa>=1.0.0", "torch>=2.14.1", "transformers>=5.19.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_toolkit"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "B",
  "B9",
  "I",
  "UP",
  "SIM",
  "C4",
  "ARG",
  "DTZ",
  "G",
  "S",
  "RUF",
  "PT",
  "PIE",
  "T20",
]
ignore = ["B008", "S101", "S105", "S106", "G004", "T201", "S112", "E731", "S311"]
unfixable = ["DTZ", "S"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**/*" = ["S101", "ARG", "T20"]
"test_*.py" = ["S101", "ARG", "T20"]
"*.ipynb" = ["T20", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["youtube_toolkit"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
docstring-code-format = true
