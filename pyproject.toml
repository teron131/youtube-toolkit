[project]
name = "youtube-toolkit"
version = "0.1.0"
description = "Transcript-first YouTube research toolkit for agents and local workflows"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "opencc>=1.3.1",
    "yt-dlp>=2026.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.1",
]

[project.scripts]
youtube = "youtube_toolkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["youtube_toolkit"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "B",
    "I",
    "UP",
    "SIM",
    "C4",
    "RUF",
    "S",
]
ignore = [
    "S607",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101"]
