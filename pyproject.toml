[project]
name = "youtube-toolkit"
version = "0.5.4"
description = "Transcript-first YouTube research toolkit for agents and local workflows"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain-core>=1.2.12",
    "langchain-openai>=1.1.9",
    "opencc>=1.3.1",
    "pydantic>=2.12.5",
    "pyturso>=0.6.1",
    "yt-dlp>=2026.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.1",
]

[project.scripts]
youtube = "youtube_toolkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["youtube_toolkit"]

[tool.ruff]
line-length = 180

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",
    "B", "B9",
    "I",
    "UP",
    "SIM",
    "C4",
    "ARG",
    "DTZ",
    "G",
    "S",
    "RUF",
    "PT",
    "PIE",
    "T20"
]
ignore = [
    "B008",
    "S101",
    "S105",
    "S106",
    "G004",
    "T201",
    "S112",
    "E731",
    "S311",
    "I001",
    "S608"
]
unfixable = ["DTZ", "S"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**/*" = ["S101", "ARG", "T20"]
"test_*.py" = ["S101", "ARG", "T20"]
"*.ipynb" = ["T20", "E402"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
docstring-code-format = true
