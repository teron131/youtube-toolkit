<!-- Browse the active LanceDB store through a live read-only data grid. -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LanceDB Viewer</title>
  <link rel="stylesheet" href="/viewer.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <ellipse cx="10" cy="4.5" rx="6.5" ry="2.5"></ellipse>
            <path d="M3.5 4.5v5c0 1.4 2.9 2.5 6.5 2.5s6.5-1.1 6.5-2.5v-5"></path>
            <path d="M3.5 9.5v5c0 1.4 2.9 2.5 6.5 2.5s6.5-1.1 6.5-2.5v-5"></path>
          </svg>
        </div>
        <div class="brand-copy">
          <h1 class="brand-name">LanceDB Viewer</h1>
          <div class="database-path" id="databasePath">Connecting to database</div>
        </div>
      </div>
      <section class="summary-strip" aria-label="Database summary">
        <div class="summary-item"><span class="summary-value" id="tableCount">0</span><span class="summary-name">tables</span></div>
        <div class="summary-item"><span class="summary-value" id="rowCount">0</span><span class="summary-name">rows</span></div>
        <div class="summary-item"><span class="summary-value" id="indexCount">0</span><span class="summary-name">indexes</span></div>
        <div class="summary-item"><span class="summary-value" id="databaseSize">0 B</span><span class="summary-name">on disk</span></div>
      </section>
      <div class="top-actions">
        <label class="live-control">
          <span>Auto refresh</span>
          <input id="liveRefresh" type="checkbox">
          <span class="switch" aria-hidden="true"></span>
        </label>
        <button class="button quiet" id="refreshButton" type="button"><span aria-hidden="true">↻</span> Refresh</button>
        <button class="button quiet theme-toggle" id="themeToggle" type="button" aria-label="Use light theme" title="Use light theme">
          <svg class="theme-icon" id="lightThemeIcon" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="10" cy="10" r="3.25"></circle>
            <path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.35 4.35l1.4 1.4M14.25 14.25l1.4 1.4M15.65 4.35l-1.4 1.4M5.75 14.25l-1.4 1.4"></path>
          </svg>
          <svg class="theme-icon" id="darkThemeIcon" viewBox="0 0 20 20" aria-hidden="true" hidden>
            <path d="M16.5 12.4A7 7 0 0 1 7.6 3.5a7 7 0 1 0 8.9 8.9Z"></path>
          </svg>
        </button>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar" aria-label="Database tables">
        <div class="sidebar-header">
          <p class="section-label">Tables</p>
          <input class="search-input" id="tableSearch" type="search" placeholder="Filter tables" aria-label="Filter tables">
        </div>
        <nav class="table-list" id="tableList"></nav>
      </aside>

      <main class="main">
        <header class="view-header">
          <div class="view-heading-row">
            <h2 class="table-title" id="tableTitle">Select a table</h2>
            <div class="table-meta" id="tableMeta"></div>
          </div>
          <div class="view-controls">
            <div class="tabs" role="tablist" aria-label="Table views">
              <button class="tab active" id="dataTab" type="button" role="tab" aria-selected="true" aria-controls="dataPanel" tabindex="0" data-tab="data">Data</button>
              <button class="tab" id="structureTab" type="button" role="tab" aria-selected="false" aria-controls="structurePanel" tabindex="-1" data-tab="structure">Structure</button>
            </div>
            <div class="data-search-controls" id="dataSearchControls">
              <div class="row-search-shell">
                <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true">
                  <circle cx="8.5" cy="8.5" r="5.25"></circle>
                  <path d="m12.5 12.5 4 4"></path>
                </svg>
                <input class="row-search" id="rowSearch" type="search" placeholder="Find text in this table" aria-label="Find literal text values across columns" autocomplete="off" spellcheck="false">
                <span class="search-shortcut" aria-hidden="true">⌘K</span>
                <button class="search-clear" id="clearSearch" type="button" aria-label="Clear row search" hidden>×</button>
              </div>
              <button class="button quiet filter-toggle" id="filterToggle" type="button" aria-expanded="false" aria-controls="filterForm">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h8M15 5h2M3 10h2M9 10h8M3 15h6M13 15h4"></path><path d="M11 3v4M7 8v4M11 13v4"></path></svg>
                <span id="filterToggleText">Filter</span><span class="filter-dot" aria-hidden="true"></span>
              </button>
            </div>
          </div>
          <form class="data-controls" id="filterForm" aria-label="Filter rows" hidden>
            <div class="filter-heading">
              <span class="filter-title">Filter rows</span>
              <button class="filter-close" id="closeFilter" type="button" aria-label="Close filter">×</button>
            </div>
            <label class="filter-field">
              <span class="filter-label">Column</span>
              <select class="control-select" id="filterColumn" aria-label="Filter column"><option value="">Choose a column</option></select>
            </label>
            <label class="filter-field">
              <span class="filter-label">Rule</span>
              <select class="control-select operator" id="filterOperator" aria-label="Filter operator"><option value="contains">contains</option></select>
            </label>
            <label class="filter-field value">
              <span class="filter-label">Value</span>
              <input class="control-input" id="filterValue" type="text" placeholder="Enter a value" aria-label="Filter value">
            </label>
            <div class="filter-actions">
              <button class="button quiet" id="clearFilter" type="button">Reset</button>
              <button class="button primary" type="submit">Apply</button>
            </div>
          </form>
        </header>

        <div class="content-shell">
          <section class="content">
            <div class="error-banner" id="errorBanner" role="alert" hidden></div>

            <div class="panel data-panel" id="dataPanel" role="tabpanel" aria-labelledby="dataTab">
              <div class="table-scroll" id="tableScroll"><div class="loading-state">Loading live rows</div></div>
              <div class="pager">
                <select class="page-size" id="pageSize" aria-label="Rows per page">
                  <option value="10">10 rows</option>
                  <option value="25" selected>25 rows</option>
                  <option value="50">50 rows</option>
                  <option value="100">100 rows</option>
                </select>
                <div class="pager-spacer"></div>
                <button class="button quiet" id="previousPage" type="button">Previous</button>
                <div class="pager-info" id="pagerInfo" aria-live="polite">0 rows</div>
                <button class="button quiet" id="nextPage" type="button">Next</button>
              </div>
            </div>

            <div class="panel structure-panel" id="structurePanel" role="tabpanel" aria-labelledby="structureTab" hidden></div>
          </section>

          <aside class="row-inspector" id="rowInspector" aria-labelledby="dialogTitle" tabindex="-1" hidden>
            <div class="inspector-header">
              <div>
                <div class="inspector-eyebrow">Row inspector</div>
                <h2 class="inspector-title" id="dialogTitle">Raw row</h2>
              </div>
              <button class="icon-button" id="closeDialog" type="button" aria-label="Close row inspector">×</button>
            </div>
            <div class="inspector-toolbar">
              <span>JSON</span>
              <button class="button quiet" id="copyRow" type="button">Copy</button>
            </div>
            <pre class="raw-json" id="rawJson"></pre>
            <div class="inspector-footer"><span class="shortcut">Esc</span> close</div>
          </aside>
        </div>
      </main>
    </div>
  </div>

  <script src="/viewer.js" defer></script>
</body>
</html>
